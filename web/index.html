<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Federal Return Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a fixed ledger strip on top with the live result, a section rail on the left,
     one document card per W-2 or 1099 on the right. Numbers always in the mono face. */
  :root {
    --bg: #f4f6f4;
    --surface: #ffffff;
    --surface-2: #e9eeeb;
    --line: #cdd6d1;
    --fg: #15201b;
    --muted: #5b6a63;
    --accent: #1e6b57;
    --accent-ink: #ffffff;
    --refund: #1e6b57;
    --owe: #a8471c;
    --warn-bg: #fbf1dc;
    --warn-fg: #6b4a05;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --surface: #1a221e; --surface-2: #222c27; --line: #35423c;
      --fg: #e6ece8; --muted: #9aa8a1; --accent: #5cc3a3; --accent-ink: #0d1612;
      --refund: #5cc3a3; --owe: #f0956a; --warn-bg: #3a2e12; --warn-fg: #f3d58a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --surface: #1a221e; --surface-2: #222c27; --line: #35423c;
    --fg: #e6ece8; --muted: #9aa8a1; --accent: #5cc3a3; --accent-ink: #0d1612;
    --refund: #5cc3a3; --owe: #f0956a; --warn-bg: #3a2e12; --warn-fg: #f3d58a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  .num, input[type="number"], .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  .strip {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .strip-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; }
  .strip h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .strip .year { color: var(--muted); font-weight: 400; }
  .result { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
  .result .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .result .amount { font-family: var(--font-num); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .result.refund .amount { color: var(--refund); }
  .result.owe .amount { color: var(--owe); }
  .kpis { display: flex; gap: 18px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .kpis b { color: var(--fg); font-weight: 500; }

  .page {
    max-width: 1120px; margin: 0 auto;
    padding-block: 18px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px;
  }
  @media (max-width: 760px) { .page { grid-template-columns: 1fr; } .rail { position: static; } }
  .rail { position: sticky; top: 72px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  .rail button {
    text-align: left; background: none; border: 0; border-left: 3px solid transparent;
    padding: 7px 10px; border-radius: 0 6px 6px 0; cursor: pointer; color: var(--muted);
  }
  .rail button:hover { background: var(--surface-2); }
  .rail button.active { color: var(--fg); border-left-color: var(--accent); background: var(--surface-2); font-weight: 500; }
  .rail button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rail .count { float: right; font-family: var(--font-num); font-size: 12px; color: var(--muted); }

  main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  section[hidden] { display: none; }
  h2 { font-size: 19px; font-weight: 600; margin: 4px 0 2px; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0 0 8px; max-width: 65ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .card-head .title { font-weight: 600; }
  .card-head .tag { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .card-head .remove { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  label.f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  label.f span { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
  label.f span .box { font-family: var(--font-num); color: var(--fg); margin-right: 4px; }
  input[type="text"], input[type="number"], input[type="date"], select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; width: 100%;
  }
  input[type="number"] { text-align: right; }
  label.c { display: flex; align-items: center; gap: 8px; padding-top: 18px; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  table.lines { width: 100%; border-collapse: collapse; }
  table.lines td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.lines td.ln { color: var(--muted); font-family: var(--font-num); width: 3.2em; }
  table.lines td.amt { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.lines td.note { color: var(--muted); font-size: 13px; }
  table.lines tr.total td { font-weight: 600; border-bottom: 2px solid var(--fg); }
  table.lines tr.head td { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 0; padding-top: 12px; }
  .tablewrap { overflow-x: auto; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  details summary { cursor: pointer; font-weight: 500; }
  .warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
  .pill { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; margin: 2px 4px 2px 0; }
  textarea { width: 100%; min-height: 160px; font: 12px/1.4 var(--font-num); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 8px; }
  .error { color: var(--owe); }
  @media (prefers-reduced-motion: no-preference) { .result .amount { transition: color 0.2s; } }
</style>

<header class="strip">
  <div class="strip-inner">
    <h1>Federal Return Workbench <span class="year" id="yearLabel">tax year 2025</span></h1>
    <div class="kpis" id="kpis"></div>
    <div class="result" id="result"><span class="label">Refund</span><span class="amount">$0</span></div>
  </div>
</header>

<div class="page">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>
