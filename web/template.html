<title>Federal Return Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a fixed ledger strip on top with the live result, a section rail on the left,
     one document card per W-2 or 1099 on the right. Numbers always in the mono face. */
  :root {
    --bg: #f4f6f4;
    --surface: #ffffff;
    --surface-2: #e9eeeb;
    --line: #cdd6d1;
    --fg: #15201b;
    --muted: #5b6a63;
    --accent: #1e6b57;
    --accent-ink: #ffffff;
    --refund: #1e6b57;
    --owe: #a8471c;
    --warn-bg: #fbf1dc;
    --warn-fg: #6b4a05;
    --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121815; --surface: #1a221e; --surface-2: #222c27; --line: #35423c;
      --fg: #e6ece8; --muted: #9aa8a1; --accent: #5cc3a3; --accent-ink: #0d1612;
      --refund: #5cc3a3; --owe: #f0956a; --warn-bg: #3a2e12; --warn-fg: #f3d58a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121815; --surface: #1a221e; --surface-2: #222c27; --line: #35423c;
    --fg: #e6ece8; --muted: #9aa8a1; --accent: #5cc3a3; --accent-ink: #0d1612;
    --refund: #5cc3a3; --owe: #f0956a; --warn-bg: #3a2e12; --warn-fg: #f3d58a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body); margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  .num, input[type="number"], .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

  .strip {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .strip-inner { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 24px; }
  .strip h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.01em; }
  .strip .year { color: var(--muted); font-weight: 400; }
  .result { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
  .result .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .result .amount { font-family: var(--font-num); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .result.refund .amount { color: var(--refund); }
  .result.owe .amount { color: var(--owe); }
  .kpis { display: flex; gap: 18px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .kpis b { color: var(--fg); font-weight: 500; }

  .page {
    max-width: 1120px; margin: 0 auto;
    padding-block: 18px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px;
  }
  @media (max-width: 760px) { .page { grid-template-columns: 1fr; } .rail { position: static; } }
  .rail { position: sticky; top: 72px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  .rail button {
    text-align: left; background: none; border: 0; border-left: 3px solid transparent;
    padding: 7px 10px; border-radius: 0 6px 6px 0; cursor: pointer; color: var(--muted);
  }
  .rail button:hover { background: var(--surface-2); }
  .rail button.active { color: var(--fg); border-left-color: var(--accent); background: var(--surface-2); font-weight: 500; }
  .rail button:focus-visible, .btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rail .count { float: right; font-family: var(--font-num); font-size: 12px; color: var(--muted); }

  main { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  section[hidden] { display: none; }
  h2 { font-size: 19px; font-weight: 600; margin: 4px 0 2px; text-wrap: balance; }
  .lede { color: var(--muted); margin: 0 0 8px; max-width: 65ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .card-head .title { font-weight: 600; }
  .card-head .tag { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .card-head .remove { margin-left: auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 14px; }
  .grid.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  label.f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  label.f span { font-size: 12px; color: var(--muted); letter-spacing: 0.01em; }
  label.f span .box { font-family: var(--font-num); color: var(--fg); margin-right: 4px; }
  input[type="text"], input[type="number"], input[type="date"], select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; width: 100%;
  }
  input[type="number"] { text-align: right; }
  label.c { display: flex; align-items: center; gap: 8px; padding-top: 18px; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.small { padding: 3px 9px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  table.lines { width: 100%; border-collapse: collapse; }
  table.lines td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.lines td.ln { color: var(--muted); font-family: var(--font-num); width: 3.2em; }
  table.lines td.amt { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.lines td.note { color: var(--muted); font-size: 13px; }
  table.lines tr.total td { font-weight: 600; border-bottom: 2px solid var(--fg); }
  table.lines tr.head td { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 0; padding-top: 12px; }
  .tablewrap { overflow-x: auto; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  details summary { cursor: pointer; font-weight: 500; }
  .warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 8px 12px; font-size: 14px; }
  .pill { display: inline-block; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 13px; margin: 2px 4px 2px 0; }
  textarea { width: 100%; min-height: 160px; font: 12px/1.4 var(--font-num); background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: 8px; }
  .error { color: var(--owe); }
  @media (prefers-reduced-motion: no-preference) { .result .amount { transition: color 0.2s; } }
</style>

<header class="strip">
  <div class="strip-inner">
    <h1>Federal Return Workbench <span class="year" id="yearLabel">tax year 2025</span></h1>
    <div class="kpis" id="kpis"></div>
    <div class="result" id="result"><span class="label">Refund</span><span class="amount">$0</span></div>
  </div>
</header>

<div class="page">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<!--ENGINE-->
<script>
(function () {
  'use strict';
  const E = window.TaxEngine;
  const $ = (sel, el) => (el || document).querySelector(sel);
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v !== false && v !== null && v !== undefined) el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid !== null && kid !== undefined) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  };
  const money = (n) => (n < 0 ? '(' + Math.abs(n).toLocaleString('en-US') + ')' : n.toLocaleString('en-US'));
  const dollars = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US');

  // ---------- state ----------
  const EXAMPLE = {
    taxYear: 2025, filingStatus: 'mfj',
    taxpayer: { firstName: 'Alex', lastName: 'Example', age65OrOlder: false, blind: false },
    spouse: { firstName: 'Sam', lastName: 'Example', age65OrOlder: false, blind: false },
    dependents: [{ name: 'Kid One', relationship: 'child', age: 8, qualifyingChild: true, hasValidSsn: true }, { name: 'Kid Two', relationship: 'child', age: 15, qualifyingChild: true, hasValidSsn: true }],
    w2s: [
      { employer: 'Acme Corp', owner: 'taxpayer', box1: 120000, box2: 18000, box3: 125000, box4: 7750, box5: 125000, box6: 1812.5, box12: [], qualifiedTips: 0, qualifiedOvertime: 0, state: 'CA', box16: 125000, box17: 7000 },
      { employer: 'Globex', owner: 'spouse', box1: 60000, box2: 6000, box3: 62000, box4: 3844, box5: 62000, box6: 899, box12: [], qualifiedTips: 0, qualifiedOvertime: 0, state: 'CA', box16: 62000, box17: 2500 },
    ],
    int1099s: [{ payer: 'Community Bank', box1: 1200.49, box3: 0, box4: 0, box8: 0 }],
    div1099s: [{ payer: 'Brokerage', box1a: 4000, box1b: 3000, box2a: 500, box4: 0, box5: 0, box7: 0 }],
    lots: [
      { description: 'ABC 10 sh', dateAcquired: '2025-02-01', dateSold: '2025-06-01', proceeds: 5000, basis: 4000, adjustmentCode: '', adjustment: 0, term: 'short', basisReported: true },
      { description: 'XYZ 5 sh', dateAcquired: '2022-01-01', dateSold: '2025-03-01', proceeds: 3000, basis: 5000, adjustmentCode: 'W', adjustment: 500, term: 'long', basisReported: true },
    ],
    capitalLossCarryover: { shortTerm: 0, longTerm: 0 },
    scheduleC: [],
    foreignAccounts: [],
    adjustments: { hsaDeduction: 0, iraDeduction: 0, studentLoanInterest: 0, other: 0 },
    itemized: { medical: 0, stateLocalIncomeTaxOther: 0, realEstateTax: 6000, personalPropertyTax: 0, mortgageInterest: 9000, charityCash: 2000, charityNoncash: 0, other: 0 },
    deductionMethod: 'auto',
    forceStandardDeduction: false,
    schedule1A: { carLoanInterest: 0 },
    payments: { estimated: 0, extension: 0, otherWithholding: 0 },
  };
  const blank = () => ({
    ...JSON.parse(JSON.stringify(EXAMPLE)),
    taxpayer: { firstName: '', lastName: '', age65OrOlder: false, blind: false },
    spouse: { firstName: '', lastName: '', age65OrOlder: false, blind: false },
    dependents: [], w2s: [], int1099s: [], div1099s: [], lots: [], scheduleC: [], foreignAccounts: [],
    itemized: { medical: 0, stateLocalIncomeTaxOther: 0, realEstateTax: 0, personalPropertyTax: 0, mortgageInterest: 0, charityCash: 0, charityNoncash: 0, other: 0 },
  });
  const NEW = {
    w2: () => ({ employer: '', owner: 'taxpayer', box1: 0, box2: 0, box3: 0, box4: 0, box5: 0, box6: 0, box12: [], qualifiedTips: 0, qualifiedOvertime: 0, state: '', box16: 0, box17: 0 }),
    int: () => ({ payer: '', box1: 0, box3: 0, box4: 0, box8: 0 }),
    div: () => ({ payer: '', box1a: 0, box1b: 0, box2a: 0, box4: 0, box5: 0, box7: 0 }),
    lot: () => ({ description: '', dateAcquired: '', dateSold: '', proceeds: 0, basis: 0, adjustmentCode: '', adjustment: 0, term: 'long', basisReported: true }),
    c: () => ({ name: '', owner: 'taxpayer', grossReceipts: 0, returnsAndAllowances: 0, costOfGoodsSold: 0, expenses: 0 }),
    dep: () => ({ name: '', relationship: 'child', age: 0, qualifyingChild: true, hasValidSsn: true }),
    fa: () => ({ institution: '', accountNumber: '', accountType: 'bank', otherTypeDescription: '', street: '', city: '', stateProvince: '', postalCode: '', country: '', owner: 'taxpayer', signatureAuthorityOnly: false, currency: 'USD', maxValue: 0, maxValueUnknown: false, treasuryRate: 1 }),
  };

  let state = null;
  let isExample = false;
  try {
    const saved = localStorage.getItem('taxReturn');
    if (saved) state = JSON.parse(saved);
  } catch (e) { state = null; }
  if (!state) { state = JSON.parse(JSON.stringify(EXAMPLE)); isExample = true; }
  // Returns saved before a section existed get its empty list.
  if (!Array.isArray(state.foreignAccounts)) state.foreignAccounts = [];
  if (!state.deductionMethod) state.deductionMethod = state.forceStandardDeduction ? 'standard' : 'auto';

  const persist = () => { try { localStorage.setItem('taxReturn', JSON.stringify(state)); } catch (e) { /* storage unavailable */ } };
  const getPath = (obj, path) => path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  const setPath = (obj, path, value) => {
    const keys = path.split('.');
    let o = obj;
    for (const k of keys.slice(0, -1)) o = o[k];
    o[keys[keys.length - 1]] = value;
  };

  // ---------- fields ----------
  const field = (label, path, opts) => {
    opts = opts || {};
    const value = getPath(state, path);
    const id = 'f_' + path.replace(/\./g, '_');
    let input;
    if (opts.type === 'select') {
      input = h('select', { id, 'data-path': path, 'data-kind': 'text' }, opts.options.map(([v, t]) => h('option', { value: v, selected: v === value }, t)));
    } else if (opts.type === 'checkbox') {
      input = h('input', { id, type: 'checkbox', 'data-path': path, 'data-kind': 'bool', checked: !!value });
      return h('label', { class: 'c' }, input, h('span', {}, label));
    } else if (opts.type === 'date') {
      input = h('input', { id, type: 'date', 'data-path': path, 'data-kind': 'text', value: value || '' });
    } else if (opts.type === 'text') {
      input = h('input', { id, type: 'text', 'data-path': path, 'data-kind': 'text', value: value || '', placeholder: opts.placeholder || '' });
    } else {
      input = h('input', { id, type: 'number', step: 'any', 'data-path': path, 'data-kind': 'num', value: value === 0 || value ? value : '', placeholder: '0' });
    }
    const cap = opts.box ? [h('span', { class: 'box' }, opts.box), label] : [label];
    return h('label', { class: 'f' }, h('span', {}, ...cap), input);
  };
  document.addEventListener('input', (ev) => {
    const el = ev.target;
    const path = el.getAttribute('data-path');
    if (!path) return;
    const kind = el.getAttribute('data-kind');
    let v;
    if (kind === 'num') v = el.value === '' ? 0 : Number(el.value);
    else if (kind === 'bool') v = el.checked;
    else v = el.value;
    if (kind === 'num' && Number.isNaN(v)) return;
    setPath(state, path, v);
    isExample = false;
    persist();
    if (path === 'filingStatus' || path === 'taxYear') { if (path === 'taxYear') state.taxYear = Number(v); renderSections(); }
    recompute();
  });

  const docCard = (title, tag, listPath, i, fields, onRemove) => h('div', { class: 'card' },
    h('div', { class: 'card-head' }, h('span', { class: 'title' }, title), h('span', { class: 'tag' }, tag),
      h('button', { class: 'btn small remove', type: 'button', onclick: () => { getPath(state, listPath).splice(i, 1); isExample = false; persist(); renderSections(); recompute(); } }, 'Remove')),
    h('div', { class: 'grid' }, fields));
  const addButton = (text, listPath, make) => h('button', { class: 'btn primary', type: 'button', onclick: () => { getPath(state, listPath).push(make()); isExample = false; persist(); renderSections(); recompute(); } }, text);
  const ownerOpts = () => (['mfj', 'qss'].includes(state.filingStatus) ? [['taxpayer', 'Taxpayer'], ['spouse', 'Spouse']] : [['taxpayer', 'Taxpayer']]);

  // ---------- sections ----------
  const SECTIONS = [
    { id: 'about', title: 'About you', count: () => '' },
    { id: 'import', title: 'Import PDFs', count: () => '' },
    { id: 'w2', title: 'W-2 wages', count: () => state.w2s.length },
    { id: 'int', title: '1099-INT interest', count: () => state.int1099s.length },
    { id: 'div', title: '1099-DIV dividends', count: () => state.div1099s.length },
    { id: 'stocks', title: 'Stock sales', count: () => state.lots.length },
    { id: 'biz', title: 'Business', count: () => state.scheduleC.length },
    { id: 'foreign', title: 'Foreign accounts', count: () => state.foreignAccounts.length },
    { id: 'ded', title: 'Deductions', count: () => '' },
    { id: 'pay', title: 'Payments', count: () => '' },
    { id: 'review', title: 'Review return', count: () => '' },
    { id: 'data', title: 'Save / load', count: () => '' },
  ];
  let active = 'about';
  try { const a = localStorage.getItem('taxActive'); if (a && SECTIONS.some((s) => s.id === a)) active = a; } catch (e) { /* ignore */ }

  const renderRail = () => {
    const rail = $('#rail');
    rail.replaceChildren(...SECTIONS.map((s) => h('button', { type: 'button', class: s.id === active ? 'active' : '', onclick: () => { active = s.id; try { localStorage.setItem('taxActive', active); } catch (e) { /* ignore */ } renderRail(); showActive(); } }, s.title, h('span', { class: 'count' }, s.count()))));
  };
  const showActive = () => { for (const sec of document.querySelectorAll('main > section')) sec.hidden = sec.id !== 'sec_' + active; window.scrollTo({ top: 0 }); };

  const sectionAbout = () => {
    const married = ['mfj', 'mfs', 'qss'].includes(state.filingStatus);
    if (married && !state.spouse) state.spouse = { firstName: '', lastName: '', age65OrOlder: false, blind: false };
    return h('section', { id: 'sec_about' },
      h('h2', {}, 'About you'),
      h('p', { class: 'lede' }, 'Filing status and household. Dependents under 17 at year end count for the child tax credit.'),
      h('div', { class: 'card' }, h('div', { class: 'grid' },
        field('Tax year', 'taxYear', { type: 'select', options: [['2025', '2025 (file in 2026)'], ['2026', '2026 (file in 2027)']] }),
        field('Filing status', 'filingStatus', { type: 'select', options: [['single', 'Single'], ['mfj', 'Married filing jointly'], ['mfs', 'Married filing separately'], ['hoh', 'Head of household'], ['qss', 'Qualifying surviving spouse']] }))),
      h('div', { class: 'card' }, h('div', { class: 'card-head' }, h('span', { class: 'title' }, 'Taxpayer')), h('div', { class: 'grid' },
        field('First name', 'taxpayer.firstName', { type: 'text' }), field('Last name', 'taxpayer.lastName', { type: 'text' }),
        field('65 or older', 'taxpayer.age65OrOlder', { type: 'checkbox' }), field('Blind', 'taxpayer.blind', { type: 'checkbox' }))),
      married ? h('div', { class: 'card' }, h('div', { class: 'card-head' }, h('span', { class: 'title' }, 'Spouse')), h('div', { class: 'grid' },
        field('First name', 'spouse.firstName', { type: 'text' }), field('Last name', 'spouse.lastName', { type: 'text' }),
        field('65 or older', 'spouse.age65OrOlder', { type: 'checkbox' }), field('Blind', 'spouse.blind', { type: 'checkbox' }))) : null,
      ...state.dependents.map((d, i) => docCard(d.name || 'Dependent ' + (i + 1), 'dependent', 'dependents', i, [
        field('Name', 'dependents.' + i + '.name', { type: 'text' }), field('Relationship', 'dependents.' + i + '.relationship', { type: 'text' }),
        field('Age at year end', 'dependents.' + i + '.age'), field('Qualifying child', 'dependents.' + i + '.qualifyingChild', { type: 'checkbox' }),
        field('Has valid SSN', 'dependents.' + i + '.hasValidSsn', { type: 'checkbox' })])),
      h('div', { class: 'row' }, addButton('Add dependent', 'dependents', NEW.dep)));
  };

  // ---------- PDF import ----------
  const importLog = [];
  const readPdfItems = async (file) => {
    const lib = window.pdfjsLib;
    if (!lib) throw new Error('The PDF reader library did not load.');
    lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const data = new Uint8Array(await file.arrayBuffer());
    const doc = await lib.getDocument({ data }).promise;
    const items = [];
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      const tc = await page.getTextContent();
      for (const it of tc.items) if (it.str && it.str.trim()) items.push({ str: it.str, x: it.transform[4], y: it.transform[5], page: p });
    }
    return items;
  };
  const importFiles = async (files, owner) => {
    for (const file of files) {
      try {
        const doc = E.parseTaxDocument(await readPdfItems(file));
        if (doc.message) { importLog.unshift({ file: file.name, ok: false, text: doc.message }); continue; }
        let text;
        if (doc.type === 'w2') {
          state.w2s.push({ employer: doc.employer, owner, box1: doc.box1, box2: doc.box2, box3: doc.box3, box4: doc.box4, box5: doc.box5, box6: doc.box6, box12: doc.box12, qualifiedTips: 0, qualifiedOvertime: 0, state: doc.state, box16: doc.box16, box17: doc.box17 });
          text = 'W-2 from ' + (doc.employer || 'unknown employer') + ': wages ' + money(doc.box1) + ', withheld ' + money(doc.box2) + ', Medicare wages ' + money(doc.box5) + ', state tax ' + money(doc.box17);
        } else if (doc.type === '1099-int') {
          state.int1099s.push({ payer: doc.payer, box1: doc.box1, box3: doc.box3, box4: doc.box4, box8: doc.box8 });
          text = '1099-INT from ' + doc.payer + ': interest ' + money(doc.box1);
        } else {
          state.div1099s.push({ payer: doc.payer, box1a: doc.box1a, box1b: doc.box1b, box2a: doc.box2a, box4: doc.box4, box5: doc.box5, box7: doc.box7 });
          text = '1099-DIV from ' + doc.payer + ': ordinary ' + money(doc.box1a) + ', qualified ' + money(doc.box1b);
        }
        if (doc.missing.length) text += '. Could not find ' + doc.missing.join(', ') + ', entered as 0.';
        importLog.unshift({ file: file.name, ok: true, text });
